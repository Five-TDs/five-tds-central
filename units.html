    <!-- =========================
         PAGE HEADER
    ========================== -->

    <header class="page-header">

        <h1>UNIT DATABASE</h1>

        <p>Browse all available units</p>

    </header>



    <!-- =========================
         SEARCH + FILTERS
    ========================== -->

    <div class="search-area">

        <div class="search-container">

            <input
                type="text"
                id="search-input"
                placeholder="Search units..."
                autocomplete="off"
            >

            <button
                id="filter-button"
                type="button"
                aria-label="Open filters"
            >
                <span>⮟</span>
            </button>

        </div>


        <!-- FILTER PANEL -->

        <div id="filters">


            <!-- RARITY -->

            <div class="filter-group">

                <div class="filter-title">
                    RARITY
                </div>

                <div class="filter-buttons">

                    <button
                        class="filter-option rarity-option"
                        data-value="Common"
                        type="button"
                    >
                        Common
                    </button>

                    <button
                        class="filter-option rarity-option"
                        data-value="Uncommon"
                        type="button"
                    >
                        Uncommon
                    </button>

                    <button
                        class="filter-option rarity-option"
                        data-value="Rare"
                        type="button"
                    >
                        Rare
                    </button>

                    <button
                        class="filter-option rarity-option"
                        data-value="Epic"
                        type="button"
                    >
                        Epic
                    </button>

                    <button
                        class="filter-option rarity-option"
                        data-value="Exclusive"
                        type="button"
                    >
                        Exclusive
                    </button>

                    <button
                        class="filter-option rarity-option"
                        data-value="Legendary"
                        type="button"
                    >
                        Legendary
                    </button>

                </div>

            </div>



            <!-- ATTACK TYPE -->

            <div class="filter-group">

                <div class="filter-title">
                    ATTACK TYPE
                </div>

                <div class="filter-buttons">

                    <button
                        class="filter-option type-option"
                        data-value="Single"
                        type="button"
                    >
                        Single
                    </button>

                    <button
                        class="filter-option type-option"
                        data-value="Pierce"
                        type="button"
                    >
                        Pierce
                    </button>

                    <button
                        class="filter-option type-option"
                        data-value="Splash"
                        type="button"
                    >
                        Splash
                    </button>

                    <button
                        class="filter-option type-option"
                        data-value="Cone"
                        type="button"
                    >
                        Cone
                    </button>

                    <button
                        class="filter-option type-option"
                        data-value="AOE"
                        type="button"
                    >
                        AOE
                    </button>

                    <button
                        class="filter-option type-option"
                        data-value="Toxic Pierce"
                        type="button"
                    >
                        Toxic Pierce
                    </button>

                    <button
                        class="filter-option type-option"
                        data-value="Speed Buff"
                        type="button"
                    >
                        Speed Buff
                    </button>

                    <button
                        class="filter-option type-option"
                        data-value="Damage Buff"
                        type="button"
                    >
                        Damage Buff
                    </button>

                    <button
                        class="filter-option type-option"
                        data-value="Range Buff"
                        type="button"
                    >
                        Range Buff
                    </button>

                    <button
                        class="filter-option type-option"
                        data-value="Slower"
                        type="button"
                    >
                        Slower
                    </button>

                </div>

            </div>


        </div>

    </div>
