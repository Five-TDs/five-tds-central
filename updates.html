
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Updates | FIVE TD'S CENTRAL</title>

    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/pages/updates.css">
</head>
<body>

    <!-- Shared website navigation -->
    <script src="js/site.js"></script>

    <main class="updates-page">

        <header class="updates-header" id="updates-header">
            <h1>UPDATES</h1>
            <p>
                Game updates, new features,
                balancing changes, and bug fixes.
            </p>
        </header>

        <div id="updates-content"></div>

    </main>

    <div id="update-image-modal"
         class="update-image-modal"
         aria-hidden="true">

        <button type="button"
                class="update-image-close"
                aria-label="Close image">
            &times;
        </button>

        <img id="update-modal-image" alt="">
    </div>

    <script src="js/data/updates.js"></script>
    <script src="js/pages/updates.js"></script>

</body>
</html>
