    <!-- =========================
         PAGE
    ========================== -->

    <main class="raw-dps-page">


        <!-- =========================
             NOTICE
        ========================== -->

        <div class="notice">

            <span class="notice-icon">
                ⚠
            </span>

            <div>

                <strong>NOTICE:</strong>

                VALUES SHOW RAW DPS AT MAX IN-GAME LEVEL.

            </div>

        </div>



        <!-- =========================
             SEARCH + FILTERS
        ========================== -->

        <div class="search-area">


            <div class="search-row">

                <input
                    id="search-input"
                    type="text"
                    placeholder="SEARCH UNIT..."
                    autocomplete="off"
                >


                <button
                    id="filter-button"
                    type="button"
                >

                    FILTER

                    <span id="filter-arrow">
                        ▾
                    </span>

                </button>

            </div>



            <!-- =========================
                 FILTER PANEL
            ========================== -->

            <div
                id="filters"
                class="filters"
            >


                <!-- RARITY -->

                <div class="filter-group">

                    <div class="filter-title">
                        RARITY
                    </div>


                    <div class="filter-options">

                        <button
                            class="rarity-option"
                            data-value="Legendary"
                            type="button"
                        >
                            LEGENDARY
                        </button>

                        <button
                            class="rarity-option"
                            data-value="Exclusive"
                            type="button"
                        >
                            EXCLUSIVE
                        </button>

                        <button
                            class="rarity-option"
                            data-value="Epic"
                            type="button"
                        >
                            EPIC
                        </button>

                        <button
                            class="rarity-option"
                            data-value="Rare"
                            type="button"
                        >
                            RARE
                        </button>

                        <button
                            class="rarity-option"
                            data-value="Uncommon"
                            type="button"
                        >
                            UNCOMMON
                        </button>

                        <button
                            class="rarity-option"
                            data-value="Common"
                            type="button"
                        >
                            COMMON
                        </button>

                    </div>

                </div>



                <!-- ATTACK TYPE -->

                <div class="filter-group">

                    <div class="filter-title">
                        ATTACK TYPE
                    </div>


                    <div class="filter-options">

                        <button
                            class="type-option"
                            data-value="Single"
                            type="button"
                        >
                            SINGLE
                        </button>

                        <button
                            class="type-option"
                            data-value="Pierce"
                            type="button"
                        >
                            PIERCE
                        </button>

                        <button
                            class="type-option"
                            data-value="Splash"
                            type="button"
                        >
                            SPLASH
                        </button>

                        <button
                            class="type-option"
                            data-value="Cone"
                            type="button"
                        >
                            CONE
                        </button>

                        <button
                            class="type-option"
                            data-value="AOE"
                            type="button"
                        >
                            AOE
                        </button>

                        <button
                            class="type-option"
                            data-value="Toxic Pierce"
                            type="button"
                        >
                            TOXIC PIERCE
                        </button>

                        <button
                            class="type-option"
                            data-value="Speed Buff"
                            type="button"
                        >
                            SPEED BUFF
                        </button>

                        <button
                            class="type-option"
                            data-value="Damage Buff"
                            type="button"
                        >
                            DAMAGE BUFF
                        </button>

                        <button
                            class="type-option"
                            data-value="Range Buff"
                            type="button"
                        >
                            RANGE BUFF
                        </button>

                        <button
                            class="type-option"
                            data-value="Slower"
                            type="button"
                        >
                            SLOWER
                        </button>

                    </div>

                </div>

            </div>

        </div>



        <!-- =========================
             DPS TABLE
        ========================== -->

        <section class="dps-table-container">

            <table id="dps-table">

                <thead>

                    <tr>

                        <th class="rank-column">
                            #
                        </th>

                        <th>
                            UNIT
                        </th>

                        <th>
                            RARITY
                        </th>

                        <th>
                            TYPE
                        </th>

                        <th>
                            MAX PLACED
                        </th>

                        <th>
                            CD
                        </th>

                        <th>
                            RNG
                        </th>

                        <th>
                            DMG
                        </th>

                        <th
                            id="dps-header"
                            class="sortable"
                        >
                            MAX DPS

                            <span id="sort-arrow">
                                ▼
                            </span>

                        </th>

                    </tr>

                </thead>


                <tbody id="dps-body">
                </tbody>

            </table>

        </section>
