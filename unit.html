    <!-- =========================
         UNIT PAGE
    ========================== -->

    <main class="unit-page">


        <!-- UNIT INFORMATION -->

        <section class="unit-info">


            <!-- UNIT IMAGE -->

            <div class="unit-image-container">

                <img
                    id="unit-image"
                    src=""
                    alt="Unit"
                >

            </div>



            <!-- UNIT DETAILS -->

            <div class="unit-details">

                <h1 id="unit-name">
                    Unit Name
                </h1>



                <!-- TABS -->

                <div class="unit-tabs">

                    <button
                        class="unit-tab active"
                        data-tab="general"
                        type="button"
                    >
                        GENERAL
                    </button>

                    <button
                        class="unit-tab"
                        data-tab="obtainment"
                        type="button"
                    >
                        OBTAINMENT
                    </button>

                </div>



                <!-- =========================
                     GENERAL TAB
                ========================== -->

                <div
                    id="general-tab"
                    class="tab-content active"
                >

                    <div class="info-grid">


                        <!-- RARITY -->

                        <div
                            class="info-box rarity-box"
                            id="rarity-box"
                        >

                            <span class="info-label">
                                RARITY
                            </span>

                            <span
                                id="unit-rarity"
                                class="info-value"
                            >
                                Common
                            </span>

                        </div>



                        <!-- TYPE -->

                        <div class="info-box">

                            <span class="info-label">
                                TYPE
                            </span>

                            <span
                                id="unit-type"
                                class="info-value"
                            >
                                Single
                            </span>

                        </div>



                        <!-- PLACEMENT -->

                        <div
                            class="info-box placement-box"
                            id="placement-box"
                        >

                            <span class="info-label">
                                PLACEMENT
                            </span>

                            <span
                                id="unit-placement"
                                class="info-value"
                            >
                                $0
                            </span>

                        </div>



                        <!-- MAX LIMIT -->

                        <div
                            class="info-box limit-box"
                            id="limit-box"
                        >

                            <span class="info-label">
                                MAX LIMIT
                            </span>

                            <span
                                id="unit-limit"
                                class="info-value"
                            >
                                0
                            </span>

                        </div>


                    </div>

                </div>



                <!-- =========================
                     OBTAINMENT TAB
                ========================== -->

                <div
                    id="obtainment-tab"
                    class="tab-content"
                >

                    <div class="obtainment-box">

                        <span class="info-label">
                            OBTAINMENT
                        </span>

                        <p id="unit-obtainment">
                            Not available.
                        </p>

                    </div>

                </div>


            </div>

        </section>



<!-- =========================
     STATS / ABILITIES
========================= -->

<section class="stats-section">

    <div class="stats-header">

        <button
            class="stats-tab active"
            id="stats-tab-button"
            type="button"
        >
            STATS
        </button>

        <button
            class="stats-tab"
            id="abilities-tab-button"
            type="button"
        >
            ABILITIES
        </button>

    </div>


    <!-- =========================
         STATS CONTENT
    ========================== -->

    <div
        id="stats-content"
        class="stats-content"
    >

        <div class="stats-container">

            <div class="table-wrapper">

                <table id="stats-table">

                    <thead>

                        <tr id="stats-header-row"></tr>

                    </thead>

                    <tbody id="stats-body">
                    </tbody>

                </table>

            </div>


            <div class="total-cost">

                TOTAL COST:

                <span id="total-cost">
                    $0
                </span>

            </div>

        </div>

    </div>


    <!-- =========================
         ABILITIES CONTENT
    ========================== -->

    <div
        id="abilities-content"
        class="abilities-content"
        style="display: none;"
    >

        <div class="abilities-container">

            <ul id="abilities-list">
            </ul>

        </div>

    </div>

</section>
